# yaml-language-server: $schema=https://unpkg.com/@powersync/service-schema@latest/json-schema/powersync-config.json

# Adopter Mode: this file is YOURS. Edit it to describe your own source database.
#
# Example Mode does not use it — each example mounts its own config over this one. Only variables
# prefixed PS_ can be substituted with !env.

telemetry:
  disable_telemetry_sharing: false

replication:
  connections:
    # One of: postgresql, mongodb, mysql, mssql. Only the first connection of a given type is used.
    - type: postgresql
      uri: !env PS_DATA_SOURCE_URI
      # 'disable' is fine on a private network. Use verify-full for anything reachable publicly.
      # sslmode is a Postgres-only option; MySQL and SQL Server configure TLS differently.
      sslmode: disable

storage:
  # Bucket storage is PowerSync's own internal store, not your data. It stays in a container this
  # project owns — we do not create schemas in your database.
  type: mongodb
  uri: !env PS_MONGO_URI

port: !env PS_PORT

sync_config:
  path: sync-config.yaml

client_auth:
  jwks_uri: !env PS_JWKS_URL
  audience: ["powersync-dev", "powersync"]

api:
  tokens:
    - use_a_better_token_in_production
