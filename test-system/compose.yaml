name: powersync-test-system
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    working_dir: /tmp
    command: ["/app/node_modules/.bin/tsx", "/app/index.ts"]
    environment:
      PORT: "6060"
      DATABASE_TYPE: ${DATABASE_TYPE:-postgres}
      DATABASE_URI: ${DATABASE_URI:?Run pnpm setup first}
      POWERSYNC_URL: ${POWERSYNC_URL:?Run pnpm setup first}
      JWT_ISSUER: ${JWT_ISSUER:?Run pnpm setup first}
      BATCH_ON_FATAL_ERROR: ${BATCH_ON_FATAL_ERROR:-stop}
      POWERSYNC_CONFIG_PATH: /run/secrets/auth-config.json
    volumes:
      - type: bind
        source: ./.local/auth-config.json
        target: /run/secrets/auth-config.json
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:${WRITE_API_PORT:-6062}:6060"
    networks:
      default:
        ipv4_address: ${BACKEND_DB_IP:-172.29.77.3}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:6060/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 30
  auth:
    image: node:24-bookworm-slim
    command: ["node", "/fixture/server.mjs"]
    environment:
      JWT_ISSUER: ${JWT_ISSUER:?Run setup first}
      POWERSYNC_URL: ${POWERSYNC_URL:?Configure the Cloud audience}
      WRITE_API_URL: http://backend:6060
    volumes:
      - ./.local/signing-keys.json:/run/secrets/signing-keys.json:ro
      - ./auth/server.mjs:/fixture/server.mjs:ro
    ports:
      - "127.0.0.1:${BACKEND_PORT:-6061}:6060"
    networks:
      default:
        ipv4_address: ${AUTH_GATEWAY_IP:-172.29.77.5}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:6060/api/auth/keys').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 30
  postgres:
    image: postgres:17.6-bookworm
    networks:
      default:
        ipv4_address: ${POSTGRES_DB_IP:-172.29.77.2}
    entrypoint: ["sh", "/test-system/start.sh"]
    env_file:
      - .local/database.env
    environment:
      BACKEND_DB_IP: ${BACKEND_DB_IP:-172.29.77.3}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=trust
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - type: bind
        source: ./database/start.sh
        target: /test-system/start.sh
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./database/init
        target: /docker-entrypoint-initdb.d
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./.local/tls
        target: /test-tls
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_admin -d test_system"]
      interval: 2s
      timeout: 2s
      retries: 30
volumes:
  postgres-data:
    name: powersync-test-system-postgres-data
networks:
  default:
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET:-172.29.77.0/24}
