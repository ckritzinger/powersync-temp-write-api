# Example Mode: Postgres.
#
# Overlays the base definition with a seeded Example Source Database and the demo client.
#
# NOTE: relative paths here resolve against the PROJECT directory — the repo root — not against
# this file's own location. That is why the mount below is ./examples/postgres/... and not
# ./powersync. It reads wrong; it is correct.

name: write-api-postgres

# Demo credentials: public, committed, and known to anyone who has cloned this repo — the same
# kind of throwaway as the signing keys in .env. Replace them before this is anything but a demo.

services:
  # The Example Source Database. Delete this whole directory when you no longer need it.
  pg-db:
    image: postgres:18
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: mypassword
      PGPORT: "5432"
    volumes:
      - pg_data:/var/lib/postgresql
      - ./examples/postgres/init-scripts:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    # PowerSync replicates from the write-ahead log, which needs logical decoding.
    command: ["postgres", "-c", "wal_level=logical"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    environment:
      # Facts about this flavour, not things you configure — so they live here, not in .env.
      DATABASE_TYPE: postgres
      DATABASE_URI: postgres://postgres:mypassword@pg-db:5432/postgres
    depends_on:
      pg-db:
        condition: service_healthy

  powersync:
    volumes:
      # Replaces the base's ./config mount — Compose matches volumes on their target path.
      - ./examples/postgres/powersync:/config
    environment:
      PS_DATA_SOURCE_URI: postgres://postgres:mypassword@pg-db:5432/postgres
    depends_on:
      pg-db:
        condition: service_healthy

  # The demo client. It is a test fixture bound to this example's schema — bring your own client
  # for anything real.
  frontend:
    build:
      context: ./frontend
      args:
        # These resolve in your browser, not on the compose network, so they are localhost —
        # unlike every server-to-server URL here. Vite bakes them in at build time.
        VITE_POWERSYNC_URL: http://localhost:8080
        VITE_BACKEND_URL: http://localhost:6060
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:4173"

volumes:
  pg_data:
