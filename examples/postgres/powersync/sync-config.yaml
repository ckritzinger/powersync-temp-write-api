# yaml-language-server: $schema=https://unpkg.com/@powersync/service-sync-rules@latest/schema/sync_rules.json

config:
  # The compiled-streams edition. Omitting this selects edition 1, the legacy compiler, which
  # would reject the `streams` block below.
  edition: 3

streams:
  global:
    # Streams do not subscribe by default — omit this and the client syncs nothing, with no error
    # reported anywhere. The legacy bucket_definitions format had no equivalent concept, so this
    # line is what preserves the old sync-everything-upfront behaviour.
    auto_subscribe: true
    queries:
      - SELECT * FROM lists
      - SELECT * FROM todos
