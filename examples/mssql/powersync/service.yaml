# yaml-language-server: $schema=https://unpkg.com/@powersync/service-schema@latest/json-schema/powersync-config.json

telemetry:
  disable_telemetry_sharing: false

replication:
  connections:
    - type: mssql
      uri: !env PS_DATA_SOURCE_URI
      schema: dbo
      additionalConfig:
        # The demo server uses a self-signed certificate.
        trustServerCertificate: true

storage:
  # Still ours, still inside the docker boundary.
  type: mongodb
  uri: !env PS_MONGO_URI

port: !env PS_PORT

sync_config:
  path: sync-config.yaml

client_auth:
  jwks_uri: !env PS_JWKS_URL
  audience: ["powersync-dev", "powersync"]

api:
  tokens:
    - use_a_better_token_in_production
