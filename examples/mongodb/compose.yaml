# Example Mode: MongoDB.
#
# The cheapest of the examples: it adds NO source database container. PowerSync already runs a
# Mongo replica set for bucket storage, so replication points at a second database on that same
# server. Bucket storage and your data stay in separate databases; they merely share a process.
#
# NOTE: relative paths here resolve against the PROJECT directory — the repo root — not against
# this file's own location.

name: write-api-mongodb

services:
  backend:
    environment:
      # The database name is part of the URI; the persister uses whatever it names.
      DATABASE_TYPE: mongodb
      DATABASE_URI: mongodb://mongo:27017/powersync_demo_source
    depends_on:
      mongo-rs-init:
        condition: service_completed_successfully

  powersync:
    volumes:
      - ./examples/mongodb/powersync:/config
    environment:
      PS_DATA_SOURCE_URI: mongodb://mongo:27017/powersync_demo_source

  frontend:
    build:
      context: ./frontend
      args:
        # These resolve in your browser, not on the compose network.
        VITE_POWERSYNC_URL: http://localhost:8080
        VITE_BACKEND_URL: http://localhost:6060
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:4173"
