# yaml-language-server: $schema=https://unpkg.com/@powersync/service-schema@latest/json-schema/powersync-config.json

telemetry:
  disable_telemetry_sharing: false

replication:
  connections:
    - type: mongodb
      uri: !env PS_DATA_SOURCE_URI
      # Change streams alone do not carry the document as it was before an update, which
      # replication needs. auto_configure turns on pre/post images for replicated collections.
      post_images: auto_configure

storage:
  # A different database on the same replica set as the source above. Bucket storage is still
  # ours and still inside the docker boundary.
  type: mongodb
  uri: !env PS_MONGO_URI

port: !env PS_PORT

sync_config:
  path: sync-config.yaml

client_auth:
  jwks_uri: !env PS_JWKS_URL
  audience: ["powersync-dev", "powersync"]

api:
  tokens:
    - use_a_better_token_in_production
